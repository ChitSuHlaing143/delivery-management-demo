<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery Management System Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="loginScreen" class="min-vh-100 d-flex align-items-center justify-content-center p-3 login-bg">
    <div class="card shadow-lg border-0 login-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3"><i class="bi bi-truck"></i></div>
          <h3 class="mb-1">Delivery Management System</h3>
          <p class="text-secondary mb-0">HTML + Bootstrap + JS Demo</p>
        </div>
        <form id="loginForm">
          <div class="mb-3"><label class="form-label">Username</label><input id="loginUsername" class="form-control" value="admin" required></div>
          <div class="mb-3"><label class="form-label">Password</label><input id="loginPassword" type="password" class="form-control" value="admin123" required></div>
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
        </form>
        <div class="small text-secondary mt-3">
          Demo: <code>admin/admin123</code>, <code>staff/staff123</code>, <code>delivery/delivery123</code>
        </div>
      </div>
    </div>
  </div>

  <div id="appShell" class="d-none">
    <aside class="sidebar" id="sidebar">
      <div class="p-3 border-bottom border-white border-opacity-10">
        <div class="d-flex align-items-center gap-2"><div class="brand-icon small-brand"><i class="bi bi-truck"></i></div><div><div class="fw-bold">SwiftDrop</div><small class="opacity-75">Delivery Demo</small></div></div>
      </div>
      <nav class="p-2" id="sidebarNav"></nav>
      <div class="mt-auto p-3 border-top border-white border-opacity-10 small">
        <div id="loggedUserName" class="fw-semibold"></div><div id="loggedUserRole" class="opacity-75"></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar px-3 px-md-4 py-3 d-flex align-items-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-2"><button class="btn btn-outline-secondary d-lg-none" id="mobileMenuBtn"><i class="bi bi-list"></i></button><div><h5 class="mb-0" id="pageTitle">Dashboard</h5><small class="text-secondary" id="pageSubtitle">Internal delivery operations</small></div></div>
        <div class="d-flex gap-2"><button class="btn btn-outline-primary btn-sm" id="langBtn">မြန်မာ</button><button class="btn btn-outline-danger btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right"></i></button></div>
      </header>
      <section class="p-3 p-md-4" id="content"></section>
    </main>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3"><div id="appToast" class="toast" role="alert"><div class="toast-header"><strong class="me-auto">Delivery Demo</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body" id="toastBody"></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/google-sheet.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
